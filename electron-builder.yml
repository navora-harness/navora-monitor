# electron-builder — Navora Monitor
# https://www.electron.build/configuration
#
# FFmpeg binaries are injected per-target by scripts/pack.mjs via config override.

appId: com.navora.monitor
productName: Navora Monitor
executableName: NavoraMonitor
copyright: Copyright © Navora
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# Renderer (Vite) + main/preload (esbuild). Main deps are already bundled → no node_modules.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - LICENSE
  - '!**/*.map'
  - '!**/node_modules/**'

asar: true

# Prefer China Electron mirror when unset (override with ELECTRON_MIRROR)
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  # Paths relative to buildResources (build/)
  icon: icon.ico
  target:
    - nsis
    - portable
  # Must stay true so rcedit embeds icon.ico + version metadata into the .exe.
  # Signing is skipped when CSC_IDENTITY_AUTO_DISCOVERY=false (set in pack.mjs).
  signAndEditExecutable: true

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Navora Monitor
  uninstallDisplayName: Navora Monitor
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  # SimpChinese — welcome/finish copy from build/installer.nsh
  installerLanguages:
    - zh_CN
  language: 2052
  differentialPackage: false
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico
  installerHeader: installerHeader.bmp
  installerSidebar: installerSidebar.bmp
  uninstallerSidebar: installerSidebar.bmp
  include: installer.nsh
  # Do NOT list .exe here. electron-builder excludes these globs from the app 7z and
  # only re-adds matches under resources/ — that drops the root main executable.
  preCompressedFileExtensions:
    - .mp4
    - .mkv

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
  requestExecutionLevel: user

linux:
  icon: electron/assets/icon.png
  category: Video
  maintainer: Navora <https://github.com/navora-harness>
  synopsis: LAN CCTV preview, recording, and playback
  description: Navora Monitor — local-network camera monitoring with FFmpeg-backed preview and recording.
  desktop:
    Name: Navora Monitor
    Comment: LAN CCTV monitor
    Categories: AudioVideo;Video;Recorder;
  target:
    - AppImage
    - tar.gz

# Keep release folder small in CI logs
compression: normal

# Do not publish automatically
publish: null
